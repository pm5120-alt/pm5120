.pill{

.team{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.team span{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.13);font-size:11px}
.heroCard{

.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#0f9b8f;box-shadow:0 0 0 4px rgba(20,184,166,.11)}

.result.critical{display:block;background:#fff0ef;color:#8b1b12;border-color:#f8c8c2;box-shadow:0 10px 26px rgba(180,35,24,.08)}
.result.high{display:block;background:#fff8e7;color:#6d4b00;border-color:#f4dfab}.result.low{display:block;background:#ecfaf3;color:#096544;border-color:#c8ead9}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #e5edf2;text-align:left;white-space:nowrap}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f7fafc}.table tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid transparent}.b1{background:#edf2f4;color:#53646c;border-color:#dbe5e9}.b2{background:#e9f7f7;color:#006b73;border-color:#c7eceb}.b3{background:#fff0ef;color:#9a1b12;border-color:#f5c9c4}.bp{background:#fff6df;color:#8a6100;border-color:#f3dfab}.bd{background:#eaf8f3;color:#0b7a59;border-color:#c6eadb}.bm{background:#fff0ef;color:#9a1b12;border-color:#f3cbc6}
.login{max-width:450px;margin:50px auto}.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:10px;background:#e8eff0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0f766e,#14b8a6,#38bdf8);border-radius:999px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:26px 18px}
.toast{position:fixed;right:18px;bottom:18px;background:#0b2942;color:#fff;padding:12px 15px;border-radius:13px;box-shadow:0 18px 35px rgba(11,41,66,.25);display:none;z-index:150;border:1px solid rgba(255,255,255,.12)}
.modal{position:fixed;inset:0;background:rgba(4,16,28,.62);backdrop-filter:blur(8px);display:none;place-items:center;z-index:140;padding:18px}.modal .box{background:#fff;max-width:540px;width:100%;border-radius:20px;padding:21px;box-shadow:0 28px 70px rgba(0,0,0,.25);border:1px solid #dbe5ec}
.mini{font-size:10px;color:var(--muted)}

}
</style>

<script>

 {id:'SRM-RB-2026-7024',date:'2026-09-30',age:'Adult (19-59)',gender:'Male',animal:'Dog',site:'Calf',cat:'Category I',wash:true,rig:'None Required',d1:'Done',d2:'Done',d3:'Done',status:'Done',zone:'Demo Zone E',next:'No PEP',notes:'Educational Category I example.'},
 {id:'SRM-RB-2026-8113',date:'2026-09-29',age:'Elderly (60+)',gender:'Female',animal:'Other',site:'Forearm',cat:'Category III',wash:true,rig:'HRIG Given',d1:'Done',d2:'Done',d3:'Pending',status:'Pending',zone:'Demo Zone C',next:'06 Oct 2026',notes:'Synthetic record.'},
 {id:'SRM-RB-2026-9440',date:'2026-09-28',age:'Adult (19-59)',gender:'Male',animal:'Dog',site:'Hand',cat:'Category II',wash:false,rig:'None Required',d1:'Done',d2:'Done',d3:'Done',status:'Done',zone:'Demo Zone B',next:'Course Complete',notes:'Synthetic completed record.'}
];
let records=load();let view='public';let auth=sessionStorage.getItem('ps_auth')==='1';
function load(){try{const x=JSON.parse(localStorage.getItem(CFG.key));return Array.isArray(x)&&x.length?x:seed.map(x=>({...x}));}catch{return seed.map(x=>({...x}));}}
function persist(){localStorage.setItem(CFG.key,JSON.stringify(records));}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800);}
function nav(v){const admin=['dashboard','entry','records','followups','report'];if(admin.includes(v)&&!auth){openLogin();return;}view=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function openLogin(){document.getElementById('loginModal').style.display='grid';}

function login(){if(document.getElementById('loginEmail').value.trim()===CFG.email&&document.getElementById('loginPass').value===CFG.pw){auth=true;sessionStorage.setItem('ps_auth','1');closeLogin();toast('Staff session started');nav('dashboard');}else toast('Invalid demo credentials');}

function badge(cat){return '<span class="badge '+(cat==='Category III'?'b3':cat==='Category II'?'b2':'b1')+'">'+esc(cat)+'</span>'}
function statusBadge(s){return '<span class="badge '+(s==='Done'?'bd':s==='Missed'?'bm':'bp')+'">'+esc(s)+'</span>'}

}
function publicView(){
return layout('<main class="wrap"><section class="hero"><div><span class="pill">PAWS for Protection • Rabies Awareness Hackathon</span><h1>Prevention that moves from awareness to action.</h1><p>RabiesShield 360 brings together public education, exposure triage, structured case registration, dose follow-up and surveillance reporting in one hackathon prototype.</p><div class="team">'+CFG.team.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="document.getElementById(\'triage\').scrollIntoView({behavior:\'smooth\'})">Try Triage Demo</button><button class="btn ghost" onclick="openLogin()">Explore Staff Dashboard</button></div></div><div class="heroCard"><div class="mini" style="color:#d9ffff">TEAM</div><h3>PAWSSENTINALS</h3><p class="mini" style="color:#d9ffff">SRM Institute of Science and Technology • KTR</p><div class="big">07 Oct 2026</div><div class="mini" style="color:#d9ffff">Hackathon date</div><hr style="border:0;border-top:1px solid rgba(255,255,255,.2);margin:16px 0"><div class="mini" style="color:#d9ffff">Demo data protocol</div><b>Synthetic data only</b></div></section><div class="sectionTitle"><div><h2>Core Features</h2><p>What the platform demonstrates end to end.</p></div></div><section class="grid g4"><div class="card feature"><div class="icon">⚕</div><h3>First Aid</h3><p>Immediate educational first-response guidance.</p></div><div class="card feature"><div class="icon">💉</div><h3>Vaccine Roadmap</h3><p>Visualize follow-up stages and due dates.</p></div><div class="card feature"><div class="icon">🚨</div><h3>Exposure Triage</h3><p>Rule-based urgency classification from scenario inputs.</p></div><div class="card feature"><div class="icon">📊</div><h3>Surveillance</h3><p>Shared records feed dashboards and reports.</p></div></section><div class="sectionTitle" id="triage"><div><h2>Exposure Triage Demo</h2><p>Educational decision-support prototype; not a diagnosis.</p></div></div><section class="card triage"><div class="formgrid"><div class="field"><label>Time since exposure</label><select id="tTime"><option>&lt; 2 Hours (Urgent)</option><option>2–24 Hours</option><option>1–3 Days</option><option>&gt; 3 Days</option></select></div><div class="field"><label>Exposure</label><select id="tCat"><option>Category III: Deep bite / Bleeding</option><option>Category II: Scratch / Superficial bite</option><option>Category I: Touch / Lick on intact skin</option></select></div></div><div class="field" style="margin-top:12px"><label>Wound details</label><textarea id="tNotes">Demo case: suspected animal bite on the forearm; synthetic scenario for hackathon testing.</textarea></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="triage()">Submit for Immediate Triage Notice</button><span class="mini">Use synthetic details only.</span></div><div id="triageResult" class="result"></div></section><div class="sectionTitle"><div><h2>Awareness Modules</h2><p>Public-facing educational content.</p></div></div><section class="grid g3"><div class="card"><h3>🧼 First Aid</h3><p class="mini">Wash the wound thoroughly with soap and running water and seek medical attention promptly. The app is educational and does not replace clinical advice.</p></div><div class="card"><h3>📚 WHO Exposure Categories</h3><p class="mini">Interactive examples explain Category I, II and III exposure concepts used in the demo workflow.</p></div><div class="card"><h3>🧠 Myth vs Fact</h3><p class="mini">Engagement cards highlight common rabies misconceptions and safer response habits.</p></div></section></main>');

function triage(){const cat=document.getElementById('tCat').value,time=document.getElementById('tTime').value;let level='LOW',cls='low',msg='Lower-priority educational guidance. Seek professional assessment for any concerning exposure.';if(cat.includes('III')||time.includes('< 2')){level='CRITICAL';cls='critical';msg='Seek immediate medical attention. Clean the wound promptly and follow professional post-exposure guidance.'}else if(cat.includes('II')){level='HIGH';cls='high';msg='Prompt medical assessment is recommended for this exposure scenario.'}const e=document.getElementById('triageResult');e.className='result '+cls;e.innerHTML='<b>'+level+' PRIORITY</b><div style="margin-top:5px">'+esc(msg)+'</div>';e.style.display='block';}
function dashboard(){
const total=records.length,today=records.filter(r=>r.date===CFG.date).length,c3=records.filter(r=>r.cat==='Category III').length,miss=records.filter(r=>r.status==='Missed').length,pending=records.filter(r=>r.status==='Pending').length,done=records.filter(r=>r.status==='Done').length,elig=records.filter(r=>r.cat!=='Category I').length,d3=records.filter(r=>r.cat!=='Category I'&&r.d3==='Done').length,comp=elig?Math.round(d3/elig*100):0;

" onclick="nav(\'records\')">View all</button></div><section class="card tableWrap">'+records.slice(0,6).map(r=>'<div class="row between" style="padding:11px 0;border-bottom:1px solid var(--line)"><div><b style="font-family:ui-monospace">'+r.id+'</b><div class="mini">'+r.date+' • '+r.animal+' • '+r.zone+'</div></div><div>'+badge(r.cat)+' '+statusBadge(r.status)+'</div></div>').join('')+'</section></main>');
}
function entry(){
return layout('<main class="wrap"><div class="sectionTitle"><div><h2>Daily Exposure Entry</h2><p>Create a synthetic case for the surveillance workflow.</p></div></div><section class="card"><div class="form"><div class="formgrid"><div class="field"><label>Entry date</label><input id="eDate" type="date" value="'+CFG.date+'"></div><div class="field"><label>Age group</label><select id="eAge"><option>Child (<12)</option><option>Adolescent (12-18)</option><option selected>Adult (19-59)</option><option>Elderly (60+)</option></select></div><div class="field"><label>Gender</label><select id="eGender"><option>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>Animal</label><select id="eAnimal"><option>Dog</option><option>Cat</option><option>Monkey</option><option>Other</option></select></div><div class="field"><label>WHO category</label><select id="eCat"><option>Category I</option><option>Category II</option><option selected>Category III</option></select></div><div class="field"><label>Wound site</label><input id="eSite" value="Right forearm"></div><div class="field"><label>Wound washed</label><select id="eWash"><option>Yes</option><option>No</option></select></div><div class="field"><label>RIG status</label><select id="eRig"><option>None Required</option><option>HRIG Given</option><option>Yes - Infiltrated</option></select></div><div class="field"><label>Current dose</label><select id="eDose"><option>1st Dose / Day 0</option><option>2nd Dose / Day 3</option><option>3rd Dose / Day 7</option></select></div><div class="field"><label>Community zone</label><select id="eZone"><option>Demo Zone A</option><option>Demo Zone B</option><option>Demo Zone C</option><option>Demo Zone D</option><option>Demo Zone E</option></select></div></div><div class="field"><label>Clinical observation notes</label><textarea id="eNotes">Synthetic hackathon record. No real patient information.</textarea></div><div class="row between"><span class="mini">Patient code will be generated automatically.</span><button class="btn primary" onclick="saveEntry()">Save Case Entry</button></div></div></section></main>');
}
function saveEntry(){const rand=()=>Math.floor(1000+Math.random()*8999);let id='SRM-RB-2026-'+rand();while(records.some(r=>r.id===id))id='SRM-RB-2026-'+rand();const date=document.getElementById('eDate').value,cat=document.getElementById('eCat').value,dose=document.getElementById('eDose').value;const add=(d)=>{const x=new Date(date+'T00:00:00');x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};const r={id,date,age:document.getElementById('eAge').value,gender:document.getElementById('eGender').value,animal:document.getElementById('eAnimal').value,site:document.getElementById('eSite').value,cat,wash:document.getElementById('eWash').value==='Yes',rig:document.getElementById('eRig').value,d1:dose.startsWith('1')?'Done':'Pending',d2:dose.startsWith('2')?'Done':'Pending',d3:dose.startsWith('3')?'Done':'Pending',status:cat==='Category I'?'Done':'Pending',zone:document.getElementById('eZone').value,next:cat==='Category I'?'No PEP':add(dose.startsWith('1')?3:dose.startsWith('2')?4:21),notes:document.getElementById('eNotes').value};records.unshift(r);persist();toast('Case '+id+' saved');nav('records');}
function recordsView(){return layout('<main class="wrap"><div class="sectionTitle"><div><h2>Exposure Records</h2><p>Search, filter, update and export the shared case ledger.</p></div><div class="row"><button class="btn ghost" onclick="exportCSV()">Export CSV</button><button class="btn primary" onclick="nav(\'entry\')">+ New Exposure</button></div></div><section class="card"><div class="formgrid"><div class="field"><label>Search</label><input id="rSearch" placeholder="Patient code, animal, zone" oninput="refreshRecords()"></div><div class="field"><label>Status</label><select id="rStatus" onchange="refreshRecords()"><option>All</option><option>Done</option><option>Pending</option><option>Missed</option></select></div></div></section><div id="recordsTable" style="margin-top:14px"></div></main>');}
function refreshRecords(){let q=(document.getElementById('rSearch')?.value||'').toLowerCase(),s=document.getElementById('rStatus')?.value||'All';const arr=records.filter(r=>(!q||[r.id,r.animal,r.zone,r.cat].join(' ').toLowerCase().includes(q))&&(s==='All'||r.status===s));document.getElementById('recordsTable').innerHTML='<section class="card tableWrap"><table class="table"><thead><tr><th>Patient</th><th>Date</th><th>Animal</th><th>WHO</th><th>Zone</th><th>D1</th><th>D2</th><th>D3</th><th>Status</th><th>Action</th></tr></thead><tbody>'+arr.map(r=>'<tr><td><b style="font-family:ui-monospace">'+r.id+'</b></td><td>'+r.date+'</td><td>'+esc(r.animal)+'</td><td>'+badge(r.cat)+'</td><td>'+esc(r.zone)+'</td><td>'+statusBadge(r.d1)+'</td><td>'+statusBadge(r.d2)+'</td><td>'+statusBadge(r.d3)+'</td><td>'+statusBadge(r.status)+'</td><td><button class="btn ghost" onclick="markDone(\''+r.id+'\')">Mark D2 Done</button> <button class="btn ghost" onclick="editNotes(\''+r.id+'\')">Notes</button> <button class="btn danger" onclick="delRec(\''+r.id+'\')">Delete</button></td></tr>').join('')+'</tbody></table></section>';}
function markDone(id){const r=records.find(x=>x.id===id);if(!r)return;r.d2='Done';if(r.cat!=='Category I')r.status=r.d3==='Done'?'Done':'Pending';persist();toast('Dose 2 marked done');refreshRecords();}
function editNotes(id){const r=records.find(x=>x.id===id);const n=prompt('Clinical observation notes',r.notes);if(n!==null){r.notes=n;persist();toast('Notes updated');refreshRecords();}}
function delRec(id){if(confirm('Delete this synthetic demo record?')){records=records.filter(r=>r.id!==id);persist();toast('Record deleted');refreshRecords();}}
function followups(){const arr=records.filter(r=>r.status==='Missed'||r.status==='Pending');return layout('<main class="wrap"><div class="sectionTitle"><div><h2>Follow-ups</h2><p>Prioritize pending and missed vaccination workflow items.</p></div></div><section class="grid g3">'+[['Missed',records.filter(r=>r.status==='Missed').length],['Pending',records.filter(r=>r.status==='Pending').length],['Due / Review',arr.length]].map(x=>'<div class="card stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</section><div style="margin-top:14px"></div><section class="card tableWrap"><table class="table"><thead><tr><th>Patient</th><th>WHO</th><th>Animal</th><th>Zone</th><th>Next due</th><th>Status</th><th>Action</th></tr></thead><tbody>'+arr.map(r=>'<tr><td>'+r.id+'</td><td>'+badge(r.cat)+'</td><td>'+r.animal+'</td><td>'+r.zone+'</td><td>'+r.next+'</td><td>'+statusBadge(r.status)+'</td><td><button class="btn primary" onclick="followDone(\''+r.id+'\')">Mark D2 Done Today</button></td></tr>').join('')+'</tbody></table></section></main>');}
function followDone(id){markDone(id);nav('followups');}
function report(){const m=records.filter(r=>r.date.startsWith('2026-10'));const row=(label,v)=>'<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>'+label+'</span><b>'+v+'</b></div>';return layout('<main class="wrap"><div class="sectionTitle"><div><h2>October 2026 Surveillance Report</h2><p>Generated from the shared synthetic record dataset.</p></div><button class="btn ghost" onclick="exportReport()">Export CSV</button></div><section class="grid g4">'+[['Exposure cases',m.length],['Category I',m.filter(r=>r.cat==='Category I').length],['Category II',m.filter(r=>r.cat==='Category II').length],['Category III',m.filter(r=>r.cat==='Category III').length]].map(x=>'<div class="card stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</section><section class="card" style="margin-top:16px"><h3>Surveillance Summary</h3>'+row('RIG-linked cases',m.filter(r=>r.rig!=='None Required').length)+row('Dose 1 completed',m.filter(r=>r.d1==='Done').length)+row('Dose 2 completed',m.filter(r=>r.d2==='Done').length)+row('Dose 3 completed',m.filter(r=>r.d3==='Done').length)+row('Missed follow-ups',m.filter(r=>r.status==='Missed').length)+row('Completed regimens',m.filter(r=>r.status==='Done').length)+'</section><section class="card" style="margin-top:16px"><h3>Daily Ledger</h3><div class="tableWrap"><table class="table"><thead><tr><th>Date</th><th>New</th><th>Cat I</th><th>Cat II</th><th>Cat III</th><th>Missed</th></tr></thead><tbody>'+Array.from({length:5},(_,i)=>{const d='2026-10-0'+(i+1),x=m.filter(r=>r.date===d);return '<tr><td>'+d+'</td><td>'+x.length+'</td><td>'+x.filter(r=>r.cat==='Category I').length+'</td><td>'+x.filter(r=>r.cat==='Category II').length+'</td><td>'+x.filter(r=>r.cat==='Category III').length+'</td><td>'+x.filter(r=>r.status==='Missed').length+'</td></tr>';}).join('')+'</tbody></table></div></section></main>');}
function csv(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')}
function download(name,content,type='text/csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();}
function exportCSV(){download('RabiesShield360_Records.csv',csv([['Patient','Date','Animal','WHO','Zone','D1','D2','D3','Status'],...records.map(r=>[r.id,r.date,r.animal,r.cat,r.zone,r.d1,r.d2,r.d3,r.status])]));toast('CSV exported');}
function exportSummary(){const total=records.length;download('RabiesShield360_Dashboard_Summary.csv',csv([['Metric','Value'],['Total cases',total],['Category III',records.filter(r=>r.cat==='Category III').length],['Pending',records.filter(r=>r.status==='Pending').length],['Missed',records.filter(r=>r.status==='Missed').length],['Completed',records.filter(r=>r.status==='Done').length]]));toast('Summary exported');}
function exportReport(){download('RabiesShield360_October_2026_Report.csv',csv([['Metric','Value'],['Exposure cases',records.filter(r=>r.date.startsWith('2026-10')).length],['Category I',records.filter(r=>r.cat==='Category I'&&r.date.startsWith('2026-10')).length],['Category II',records.filter(r=>r.cat==='Category II'&&r.date.startsWith('2026-10')).length],['Category III',records.filter(r=>r.cat==='Category III'&&r.date.startsWith('2026-10')).length]]));toast('Report exported');}
function render(){let c=view==='public'?publicView():view==='dashboard'?dashboard():view==='entry'?entry():view==='records'?recordsView():view==='followups'?followups():report();document.getElementById('app').innerHTML=c;if(view==='records')refreshRecords();}
render();
</script>
</body></html>
